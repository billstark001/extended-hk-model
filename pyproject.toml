[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-hk-model"
version = "0.1.0"
description = "Reusable analysis and modeling code for the extended HK model"
requires-python = ">=3.10"
dependencies = [
  "igraph",
  "leidenalg",
  "lz4",
  "matplotlib",
  "msgpack",
  "networkx",
  "numpy",
  "pandas",
  "python-dotenv",
  "scipy",
  "seaborn",
  "sqlalchemy",
  "tqdm",
  "typing_extensions>=4.12",
]

[project.optional-dependencies]
typecheck = ["mypy>=1.11"]

[project.scripts]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src", "."]
explicit_package_bases = true
follow_imports = "silent"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
files = [
  "src/common/types.py",
  "src/common/io/records.py",
  "src/common/runtime/storage.py",
  "src/common/runtime/go.py",
  "src/theory/types.py",
  "src/theory/runtime/records.py",
  "src/theory/runtime/completed.py",
  "src/theory/runtime/population.py",
  "src/theory/runtime/measure.py",
  "src/theory/runtime/archives.py",
  "src/theory/runtime/protocol.py",
  "src/common/experiments/registry.py",
  "src/common/experiments/plans.py",
  "src/common/experiments/lifecycle.py",
  "src/common/experiments/execution.py",
  "src/common/experiments/progress.py",
  "src/common/experiments/artifacts.py",
  "src/theory/variation.py",
  "experiments/paper_theory/evidence/bundle.py",
  "experiments/paper_theory/evidence/observations.py",
  "src/theory/runtime/task_adapters.py",
  "src/theory/runtime/historical.py",
  "experiments/paper_theory/types.py",
  "experiments/paper_theory/evidence/design.py",
  "experiments/paper_theory/evidence/main_design.py",
  "experiments/paper_theory/evidence/protocol.py",
  "experiments/paper_theory/study.py",
  "experiments/paper_theory/evidence/bindings.py",
  "experiments/paper_theory/evidence/analyze.py",
  "experiments/paper_theory/evidence/figures.py",
  "experiments/paper_theory/evidence/network_snapshot.py",
  "experiments/paper_theory/evidence/main_smoke_design.py",
  "tests/typing/contracts.py",
]

[[tool.mypy.overrides]]
module = ["lz4.*", "msgpack", "smp_meso_bindings.*"]
ignore_missing_imports = true
