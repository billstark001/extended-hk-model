# Keep short scientific expressions and containers compact.
target-version = "py310"
line-length = 120
extend-exclude = ["outputs", "build", "dist"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["common", "ehk", "theory", "experiments"]
split-on-trailing-comma = false

[format]
skip-magic-trailing-comma = true
